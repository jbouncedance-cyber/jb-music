<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#14213D;--ink2:#3D4A66;--gy:#6B7489;--gy2:#A9B0BF;--bd:#E2E6EC;--bg:#F4F6F8;--wh:#fff;
--ac:#1F6F78;--acb:#E6F2F3;--ac2:#2A8F9A;
--ok:#15803d;--okb:#e9f8ee;--no:#dc2626;--nob:#fdecec;--ext:#2563eb;--extb:#eaf1ff;--off:#6b7280;--offb:#f0f1f3;--mk:#b45309;--mkb:#fff4de}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.hide{display:none!important}
/* 상단 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .logo{font-weight:800;letter-spacing:.5px;font-size:16px}
.top .logo small{font-weight:500;opacity:.7;margin-left:4px;font-size:12px}
.top .me{margin-left:auto;font-size:12px;opacity:.85;text-align:right}
.demo-tag{background:#f59e0b;color:#111;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px}
/* 탭 */
.tabs{display:flex;background:var(--wh);border-bottom:1px solid var(--bd);position:sticky;top:44px;z-index:19;overflow-x:auto}
.tabs button{flex:1;min-width:64px;padding:11px 6px;font-size:14px;font-weight:600;color:var(--gy);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac)}
main{max-width:1180px;margin:0 auto;padding:14px 12px 90px}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--wh);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--gy);font-size:13px}
.small{font-size:12px}
.btn{background:var(--ac);color:#fff;padding:9px 14px;border-radius:10px;font-weight:700;font-size:14px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--wh);color:var(--ac);border:1px solid var(--ac)}
.btn.gray{background:var(--offb);color:var(--ink2)}
.btn.red{background:var(--nob);color:var(--no)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.k{display:inline-block;font-size:10.5px;font-weight:800;padding:0 5px;border-radius:5px;color:#fff;line-height:16px;vertical-align:1px}
.st-출석{background:var(--okb);color:var(--ok)}.st-결석{background:var(--nob);color:var(--no)}.st-연장{background:var(--extb);color:var(--ext)}.st-휴강{background:var(--offb);color:var(--off)}.st-보강{background:var(--mkb);color:var(--mk)}
.st-none{background:#fff;color:var(--gy2);border:1px dashed var(--gy2)}
.seg{display:inline-flex;background:var(--offb);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--gy)}
.seg button.on{background:var(--wh);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:6px}
.nav button.ar{width:34px;height:34px;border-radius:10px;background:var(--wh);border:1px solid var(--bd);font-size:16px}
.nav .lbl{font-weight:800;min-width:120px;text-align:center}
select.f,input.f,textarea.f{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fff}
textarea.f{min-height:70px;resize:vertical}
label.l{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.banner{background:var(--mkb);border:1px solid #f6d58f;color:#7a4b06;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner.info{background:var(--acb);border-color:#bfdfe2;color:#0f4f56}
.empty{padding:26px 10px;text-align:center;color:var(--gy);font-size:14px}
/* 오늘 */
.lrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--bd)}
.lrow:first-child{border-top:none}
.lrow .t{width:50px;font-weight:800;font-size:14px}
.lrow .t small{display:block;font-weight:500;color:var(--gy);font-size:11px}
.lrow .who{flex:1;min-width:0}
.lrow .who b{font-size:15px}
.lrow .who .sub{font-size:12.5px;color:var(--gy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow.done{opacity:.92}
.lrow.miss .t{color:var(--no)}
/* 시간표 */
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:collapse;width:100%;min-width:340px;table-layout:fixed}
@media(max-width:600px){table.tt td.h,table.tt th:first-child{width:40px!important;font-size:11px}.it{font-size:11.5px;padding:2px 3px}table.tt th,table.tt td{padding:2px}}
table.tt th,table.tt td{border:1px solid var(--bd);font-size:12.5px;text-align:center;vertical-align:top;padding:3px}
table.tt th{background:#F8FAFB;font-weight:700;color:var(--ink2);padding:6px 2px}
table.tt th.today{background:var(--acb);color:var(--ac)}
table.tt td.h{width:52px;color:var(--gy);font-weight:700;background:#FBFCFD;vertical-align:middle}
table.tt td.cell{height:44px;cursor:pointer}
table.tt td.cell:hover{background:#FAFCFD}
table.tt td.off{background:repeating-linear-gradient(135deg,#fafafa,#fafafa 6px,#f3f4f6 6px,#f3f4f6 12px)}
.it{display:block;border-radius:7px;padding:3px 4px;margin:1px 0;font-weight:700;line-height:1.25;text-align:left;background:#F2F6FA;border-left:3px solid var(--ac);font-size:12.5px;word-break:keep-all}
.it .tm{font-weight:500;font-size:10.5px;color:var(--gy);display:block}
.it.grp{background:#EEF0F7;border-left-color:#5b5f97}
.it.cont{opacity:.45;font-weight:500}
.it.x{border-left-style:dashed}
.it .s{display:inline-block;font-size:10px;padding:0 4px;border-radius:4px;margin-left:2px}
.it.conflict{outline:2px solid var(--no)}
.tch-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
/* 학생 */
.srow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-top:1px solid var(--bd);cursor:pointer}
.srow:first-child{border-top:none}
.srow .nm{font-weight:800;font-size:15px}
table.log{width:100%;border-collapse:collapse;font-size:13.5px}
table.log th{font-size:12px;color:var(--gy);font-weight:700;text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd)}
table.log td{padding:8px 6px;border-bottom:1px solid #EEF0F3;vertical-align:top}
table.log tr{cursor:pointer}
table.log tr:hover td{background:#FAFCFD}
/* 홈 */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 22px;color:#fff;background:linear-gradient(135deg,#14213D 0%,#1F3A5F 55%,#1F6F78 100%);margin-bottom:16px}
.hero:after{content:'';position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%)}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:3px;opacity:.75}
.hero h1{font-size:30px;letter-spacing:1px;margin:4px 0 2px;font-weight:900}
.hero .hi{opacity:.85;font-size:14.5px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.hstat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 12px;text-align:left;color:#fff;cursor:pointer}
.hstat:hover{background:rgba(255,255,255,.16)}
.hstat .v{font-size:24px;font-weight:900;line-height:1.1}
.hstat .n{font-size:12px;opacity:.8;font-weight:700}
.hstat.warn .v{color:#FFD27A}
.hsec{display:flex;align-items:baseline;gap:8px;margin:18px 2px 10px}
.hsec h3{margin:0;font-size:16px}
.subj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.subj{background:var(--wh);border:1px solid var(--bd);border-radius:18px;padding:16px 14px;cursor:pointer;text-align:left;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.subj:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,33,61,.08)}
.subj .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.subj .ic svg{width:26px;height:26px}
.subj .nm{font-size:17px;font-weight:900}
.subj .en{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gy2)}
.subj .meta{font-size:12.5px;color:var(--gy);margin-top:6px}
.subj .alert{position:absolute;top:12px;right:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qk{background:var(--wh);border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
.qk:hover{border-color:var(--ac)}
.qk .qi{width:38px;height:38px;border-radius:12px;background:var(--acb);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.qk .qi svg{width:20px;height:20px}
.qk b{display:block;font-size:14.5px}
.qk span{font-size:12px;color:var(--gy)}
.tdy{background:var(--wh);border:1px solid var(--bd);border-radius:16px;padding:6px 14px}
@media(max-width:760px){.subj-grid,.quick{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}.hstat .v{font-size:21px}}
/* 수업일지 */
.sgtabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.sgtabs button{padding:9px 16px;border-radius:12px;font-weight:800;font-size:15px;background:var(--wh);border:1px solid var(--bd);color:var(--ink2);white-space:nowrap}
.sgtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sgtabs button small{font-weight:600;opacity:.65;margin-left:3px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tchips button{padding:7px 12px;border-radius:99px;font-weight:700;font-size:14px;background:var(--wh);border:1.5px solid var(--bd);color:var(--ink2)}
.tchips button.on{border-color:currentColor;background:var(--acb)}
.lg{display:grid;grid-template-columns:330px 1fr;gap:12px;align-items:start}
.lg .list{background:var(--wh);border:1px solid var(--bd);border-radius:14px;overflow:hidden;position:sticky;top:96px;max-height:calc(100vh - 110px);overflow-y:auto}
.lg .panel{min-width:0}
.sr{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);cursor:pointer}
.sr:first-child{border-top:none}
.sr:hover{background:#F8FAFB}
.sr.on{background:var(--acb);box-shadow:inset 3px 0 0 var(--ac)}
.sr .nm{font-weight:800;font-size:15px}
.sr .sub{font-size:12px;color:var(--gy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-h{padding:8px 12px;font-size:12px;font-weight:800;color:var(--gy);background:#F8FAFB;border-top:1px solid var(--bd)}
table.log td.memo{white-space:pre-line;color:var(--ink2);font-size:12.5px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mobile-panel{margin:4px 0 10px;border:1px solid var(--bd);border-radius:14px;background:#fff;padding:12px}
table.lgt .c-d{width:88px}table.lgt .c-n,table.lgt .c-s{width:58px}
@media(max-width:899px){.lg{display:block}.lg .list{position:static;max-height:none}table.lgt{font-size:13px}table.lgt td,table.lgt th{padding:7px 3px}table.lgt .c-d{width:62px}table.lgt .c-n{width:44px}table.lgt .c-s{width:48px}table.lgt .pill{padding:2px 5px;font-size:11px}}
/* 현황 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--wh);border:1px solid var(--bd);border-radius:14px;padding:12px}
.kpi .v{font-size:24px;font-weight:800}
.kpi .n{font-size:12.5px;color:var(--gy);font-weight:700}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{font-size:12px;color:var(--gy);text-align:left;padding:7px 6px;border-bottom:1px solid var(--bd);font-weight:700;white-space:nowrap}
table.dt td{padding:8px 6px;border-bottom:1px solid #EEF0F3;white-space:nowrap}
table.dt td.num,table.dt th.num{text-align:right}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.cols2{grid-template-columns:1fr}}
/* 모달 */
.ov{position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md .mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.md .mh h3{margin:0;font-size:17px}
.md .x{margin-left:auto;font-size:22px;color:var(--gy);width:34px;height:34px}
.stbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stbtns button{padding:10px 0;border-radius:10px;font-weight:800;font-size:14px;border:1.5px solid var(--bd);background:#fff;color:var(--gy)}
.stbtns button.on{border-color:currentColor}
.stbtns button.on.st-출석{background:var(--okb);color:var(--ok)}.stbtns button.on.st-결석{background:var(--nob);color:var(--no)}.stbtns button.on.st-연장{background:var(--extb);color:var(--ext)}.stbtns button.on.st-휴강{background:var(--offb);color:var(--off)}.stbtns button.on.st-보강{background:var(--mkb);color:var(--mk)}
.mfoot{display:flex;gap:8px;margin-top:16px}
.mfoot .btn{flex:1;padding:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.2)}
/* 로그인 */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#14213D,#1F3A5F 60%,#1F6F78)}
.login .box{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:360px}
.login h1{font-size:22px;margin-bottom:2px}
.err{color:var(--no);font-size:13px;min-height:18px;margin-top:8px}
.chip{display:inline-block;padding:5px 10px;border:1px solid var(--bd);border-radius:99px;font-size:13px;font-weight:700;color:var(--ink2);background:#fff;margin:2px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
/* ============================================================
   JB MUSIC 관리앱
   - 전용 Firebase 프로젝트(jb-music-1189a) 사용. 오디션앱과 완전히 분리
   - 계정: accounts/{uid} = {role:'admin'|'teacher', loginId, name, tid}
   - 처음 한 번: setup/owner 문서가 없으면 '관리자 계정 만들기' 화면이 나옴
   - ?demo 를 붙이면 Firebase 없이 체험 데이터로 동작 (브라우저에만 저장)
   ============================================================ */
const FC={apiKey:"AIzaSyC1T_cr86nyta4c2qm4HNndgiSewlqNlQE",authDomain:"jb-music-1189a.firebaseapp.com",projectId:"jb-music-1189a",storageBucket:"jb-music-1189a.firebasestorage.app",messagingSenderId:"164994191125",appId:"1:164994191125:web:3a279b3f9e961dc6de231c"};
const DEMO=new URLSearchParams(location.search).has('demo');
let db=null;
if(!DEMO&&window.firebase){firebase.initializeApp(FC);db=firebase.firestore();}

/* ---------- 기본 값 ---------- */
const COL={teachers:'teachers',students:'students',slots:'slots',lessons:'lessons',regs:'regs'};
const KIND={A:{t:'오디션',c:'#7c3aed'},KA:{t:'키즈오디션',c:'#db2777'},H:{t:'취미',c:'#0891b2'},E:{t:'입시',c:'#ea580c'},P:{t:'전문',c:'#0f766e'}};
const SUBJ={V:'보컬',P:'피아노',C:'작곡',CP:'피아노·작곡',G:'기타',M:'미디',D:'드럼',ETC:'기타과목'};
const SGROUP=[{k:'V',t:'보컬',codes:['V']},{k:'CP',t:'피아노·작곡',codes:['P','C','CP']},{k:'G',t:'기타',codes:['G']},{k:'M',t:'미디',codes:['M']},{k:'ETC',t:'그 밖의 과목',codes:['D','ETC']}];
const STATUS=['출석','결석','연장','휴강','보강'];
const COUNTED=new Set(['출석','결석','보강']); // 회차에 들어가는 출결 (연장·휴강은 회차를 쓰지 않음)
const ROOMS_DEFAULT=['L1','L2','L3','L4','L5','L6','L7','L8','JB홀'];
const TCOLORS=['#1F6F78','#7c3aed','#db2777','#ea580c','#2563eb','#15803d','#b45309','#0f766e','#9333ea','#be123c'];
const DOW=['일','월','화','수','목','금','토'];
const DAYS=[1,2,3,4,5,6,0];
const LESSON_WINDOW_DAYS=150; // 처음 불러오는 수업 기록 범위 (무료 사용량 아끼기)

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d);};
const dow=s=>pd(s).getDay();
const today=()=>ds(new Date());
const monday=s=>{const w=dow(s);return addD(s,w===0?-6:1-w);};
const fmtD=s=>{if(!s)return '';const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()+'('+DOW[d.getDay()]+')';};
const fmtDY=s=>{if(!s)return '';const d=pd(s);return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+DOW[d.getDay()]+')';};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hr=t=>parseInt(String(t||'0').split(':')[0],10);
const endTime=(t,dur)=>{const[h,m]=String(t).split(':').map(Number);const x=h*60+m+(+dur||60);return pad(Math.floor(x/60))+':'+pad(x%60);};

function slotOn(s,date){return s.day===dow(date)&&(!s.from||s.from<=date)&&(!s.to||date<=s.to);}
function occ(date,tid){return S.slots.filter(s=>(!tid||s.tid===tid)&&slotOn(s,date)).sort((a,b)=>a.time.localeCompare(b.time));}
function lessonOf(slot,date){return S.lessons.find(l=>l.slotId===slot.id&&l.date===date);}
function extras(date,tid){const on=new Set(occ(date).map(s=>s.id));return S.lessons.filter(l=>l.date===date&&(!tid||l.tid===tid)&&!(l.slotId&&on.has(l.slotId)));}

// 회차 계산: 등록(4회 등) 마다, 그 시작일 이후의 출석·결석·보강을 순서대로 채워 넣음
let CALC={n:{},pair:{}};
function calc(){
  const P={};const get=k=>P[k]||(P[k]={ls:[],regs:[]});
  S.lessons.forEach(l=>{if(l.sid&&l.tid)get(l.sid+'|'+l.tid).ls.push(l);});
  S.regs.forEach(r=>get(r.sid+'|'+r.tid).regs.push(r));
  const n={},pair={};
  for(const[k,p]of Object.entries(P)){
    const cl=p.ls.filter(l=>COUNTED.has(l.status)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
    const regs=p.regs.sort((a,b)=>a.start.localeCompare(b.start)||(a.at||0)-(b.at||0));
    const used=new Set();let cur=null;
    regs.forEach((r,ri)=>{
      const total=+r.total||4;let c=Math.min(+r.done0||0,total);
      for(const l of cl){if(c>=total)break;if(used.has(l.id)||l.date<r.start)continue;used.add(l.id);c++;n[l.id]={n:c,total,reg:r.id};}
      r._used=c;r._total=total;r._idx=ri+1;cur=r;
    });
    let over=0;
    cl.forEach(l=>{if(!used.has(l.id)&&cur&&l.date>=cur.start){n[l.id]={over:true};over++;}});
    pair[k]=cur?{reg:cur,used:cur._used,total:cur._total,left:cur._total-cur._used,over,lastDate:cl.length?cl[cl.length-1].date:null}:{noReg:true,over:0,lastDate:cl.length?cl[cl.length-1].date:null};
  }
  CALC={n,pair};
}
const pairOf=(sid,tid)=>CALC.pair[sid+'|'+tid]||{noReg:true,over:0};
function nextCountLabel(sid,tid){
  const p=pairOf(sid,tid);
  if(p.noReg)return `<span class="pill" style="background:#f3f4f6;color:#6b7280">회차 미설정</span>`;
  if(p.left<=0)return `<span class="pill" style="background:var(--nob);color:var(--no)">재등록 필요</span>`;
  return `<span class="pill" style="background:var(--acb);color:var(--ac)">${p.used+1}/${p.total}회차</span>`;
}
function countText(l){const c=CALC.n[l.id];if(c&&c.n)return c.n+'회차';if(c&&c.over)return '<b style="color:var(--no)">초과</b>';if(l.n0)return esc(l.n0);if(!COUNTED.has(l.status))return '-';return '·';}
function lastTitle(sid,tid,beforeDate){
  const ls=S.lessons.filter(l=>l.sid===sid&&l.tid===tid&&l.title&&(!beforeDate||l.date<=beforeDate)).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
  return ls[0]?ls[0].title:'';
}
// 학생이 듣는 수업 (지금 기준 진행 중인 시간표)
function activeSlotsOf(sid){const t=today();return S.slots.filter(s=>s.sid===sid&&(!s.to||s.to>=t));}
function pairsActive(){
  const m={};const t=today();
  S.slots.forEach(s=>{if(!s.sid||(s.to&&s.to<t))return;const st=ST(s.sid);if(!st||st.off)return;m[s.sid+'|'+s.tid]={sid:s.sid,tid:s.tid,kind:s.kind||''};});
  return Object.values(m);
}
function missingLessons(tid,days=14){
  const out=[];const t=today();
  const st=S.cfg.startDate||'';
  for(let i=1;i<=days;i++){const d=addD(t,-i);if(st&&d<st)break;occ(d,tid).forEach(s=>{if(!s.sid)return;if(!lessonOf(s,d))out.push({slot:s,date:d});});}
  return out;
}

  const snap=await db.collection('accounts').doc(user.uid).get();

  const admin=a.role==='admin';
  if(!admin&&!a.tid)return null;

}
function renderSetup(msg){
  $('#app').innerHTML=`<div class="login"><div class="box">

    <h1>관리자 계정 만들기</h1><div class="muted" style="margin-bottom:12px">대표님이 쓰실 관리자 아이디를 만들어요. 이 화면은 처음 한 번만 나와요.</div>

}
async function doSetup(){
  const g=k=>($('#'+k).value||'').trim();const er=$('#su-err');
  const name=g('su-name')||'원장님',id=g('su-id').toLowerCase(),pw=$('#su-pw').value,pw2=$('#su-pw2').value;
  if(!/^[a-z0-9._-]{3,30}$/.test(id)){er.textContent='아이디는 영어 소문자·숫자 3자 이상';return;}
  if(pw.length<6){er.textContent='비밀번호는 6자 이상';return;}
  if(pw!==pw2){er.textContent='비밀번호가 서로 달라요';return;}
  $('#su-btn').disabled=true;
  try{
    const c=await firebase.auth().createUserWithEmailAndPassword(acctEmail(id),pw);const uid=c.user.uid;
    const b=db.batch();
    b.set(db.collection('setup').doc('owner'),{uid,at:Date.now()});
    b.set(db.collection('accounts').doc(uid),{uid,role:'admin',loginId:id,name,createdAt:Date.now()});
    await b.commit();
    ME={uid,name,admin:true,tid:null,loginId:id};await start();
  }catch(e){er.textContent='만들기 실패: '+(e.code==='auth/email-already-in-use'?'이미 있는 아이디예요':e.message);$('#su-btn').disabled=false;}
}
async function doLogin(){
  const id=($('#lg-id').value||'').trim().toLowerCase(),pw=$('#lg-pw').value||'';const er=$('#lg-err');
  if(!id||!pw){er.textContent='아이디와 비밀번호를 입력해주세요';return;}
  $('#lg-btn').disabled=true;er.textContent='';
  try{
    const c=await firebase.auth().signInWithEmailAndPassword(acctEmail(id),pw);
    const me=await resolveMe(c.user);
    if(!me){await firebase.auth().signOut();er.textContent='사용 권한이 없는 계정이에요. 원장님께 문의해주세요';$('#lg-btn').disabled=false;return;}
    ME=me;await start();
  }catch(e){
    er.textContent=e&&e.code==='auth/too-many-requests'?'여러 번 틀려서 잠시 막혔어요. 잠시 후 다시 해주세요':e&&e.code==='auth/network-request-failed'?'인터넷 연결을 확인해주세요':'아이디 또는 비밀번호가 맞지 않아요';
    $('#lg-btn').disabled=false;
  }
}
async function logout(){if(DEMO){location.href=location.pathname;return;}try{await firebase.auth().signOut();}catch(e){}location.replace(location.pathname);}
async function start(){
  $('#app').innerHTML='<div class="empty" style="padding-top:40vh">불러오는 중…</div>';
  try{await Store.load();}catch(e){
    $('#app').innerHTML=`<div class="login"><div class="box"><h1>불러오기 실패</h1><p class="muted" style="margin:10px 0">${esc(e.message)}</p><p class="muted small">인터넷 연결을 확인하거나 잠시 후 다시 열어주세요.</p><button class="btn" style="margin-top:12px" onclick="logout()">로그아웃</button></div></div>`;return;}
  if(!ME.admin&&ME.tid){V.ttMine=true;}else V.ttMine=false;
  render();
}
function boot(){
  if(DEMO){
    Store.load().then(async()=>{
      if(!S.teachers.length)await seedData(true);
      const p=new URLSearchParams(location.search).get('as');
      const t=p&&S.teachers.find(x=>x.name===p);
      ME=t?{uid:'demo',name:t.name,admin:false,tid:t.id}:{uid:'demo',name:'원장님',admin:true,tid:null};
      V.ttMine=!ME.admin;render();
    });
    return;
  }
  let first=true;
  firebase.auth().onAuthStateChanged(async u=>{
    if(!first)return;first=false;
    if(!u){
      try{const o=await db.collection('setup').doc('owner').get();if(!o.exists){renderSetup();return;}}catch(e){console.warn(e);}
      renderLogin();return;}
    try{const me=await resolveMe(u);if(me){ME=me;await start();return;}}catch(e){console.warn(e);}
    renderLogin('지금 로그인된 계정은 사용 권한이 없어요. 다른 아이디로 로그인해주세요');
    try{await firebase.auth().signOut();}catch(e){}
  });
}

function viewToday(m){
  const d=V.date;const isToday=d===today();
  const tids=ME.admin?activeTeachers().map(t=>t.id):[myTid()];
  let h=`<div class="row" style="margin-bottom:12px"><div class="nav"><button class="ar" onclick="V.date=addD(V.date,-1);render()">‹</button><div class="lbl">${fmtDY(d)}${isToday?' <span class="pill st-출석">오늘</span>':''}</div><button class="ar" onclick="V.date=addD(V.date,1);render()">›</button></div>
  ${isToday?'':'<button class="btn sm gray" onclick="V.date=today();render()">오늘로</button>'}<div class="sp"></div>
  <button class="btn sm ghost" onclick="openExtra()">＋ 보강·추가 수업</button></div>`;
  // 미기록 안내
  const miss=[];tids.forEach(t=>miss.push(...missingLessons(t)));
  if(miss.length){
    h+=`<div class="banner"><b>기록 안 한 지난 수업 ${miss.length}개</b> (최근 2주)<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px">${miss.slice(0,30).map(x=>`<button class="chip" onclick="openLesson('${x.slot.id}','${x.date}')">${fmtD(x.date)} ${x.slot.time} ${esc(sName(x.slot.sid))}${ME.admin?' · '+esc(tName(x.slot.tid)):''}</button>`).join('')}${miss.length>30?'<span class="muted">…</span>':''}</div></div>`;
  }
  let any=false;
  tids.forEach(tid=>{
    if(!tid)return;
    const os=occ(d,tid);const ex=extras(d,tid);
    if(!os.length&&!ex.length)return;any=true;
    const t=T(tid)||{};
    const items=[...os.map(s=>({s,l:lessonOf(s,d),time:s.time})),...ex.map(l=>({s:null,l,time:l.time||''}))].sort((a,b)=>a.time.localeCompare(b.time));
    const recorded=items.filter(x=>x.s&&x.s.sid?x.l:x.l).length;
    const indiv=items.filter(x=>!(x.s&&!x.s.sid)).length;
    h+=`<div class="card"><div class="tch-h"><span class="dot" style="background:${tColor(tid)}"></span><h3 style="margin:0">${esc(t.name||'')}T</h3><span class="muted">${esc(SUBJ[t.subj]||'')} · ${esc(t.room||'')}</span><div class="sp"></div><span class="muted small">기록 ${recorded}/${indiv}</span>
    ${(ME.admin||tid===myTid())&&items.some(x=>x.s&&x.s.sid&&!x.l)?`<button class="btn sm gray" onclick="bulkOff('${tid}')">이날 휴강 처리</button>`:''}</div>`;
    items.forEach(({s,l,time})=>{
      if(s&&!s.sid){h+=`<div class="lrow"><div class="t">${esc(time)}<small>${esc(s.room||'')}</small></div><div class="who"><b>${esc(s.label||'단체수업')}</b><div class="sub">단체 수업${s.dur?' · ~'+endTime(s.time,s.dur):''}</div></div></div>`;return;}
      const sid=s?s.sid:l.sid;const st=ST(sid)||{};const kind=s?s.kind:(l&&l.kind);
      const past=d<today();const cls=l?'done':(past?'miss':'');
      const sub=l?(l.title?'🎵 '+esc(l.title):'')+(l.memo?' · '+esc(l.memo):''):(lastTitle(sid,tid,d)?'지난 진도: '+esc(lastTitle(sid,tid,d)):'');
      const click=s?`openLesson('${s.id}','${d}')`:`openLessonById('${l.id}')`;
      h+=`<div class="lrow ${cls}" onclick="${click}" style="cursor:pointer"><div class="t">${esc(time)}<small>${esc((s&&s.room)||(l&&l.room)||'')}</small></div>
      <div class="who"><b>${esc(st.name||'?')}</b> ${kindBadge(kind)} ${!s?'<span class="muted small">(추가)</span>':''}<div class="sub">${sub||'&nbsp;'}</div></div>
      <div style="text-align:right">${l?stPill(l.status)+'<div class="muted small" style="margin-top:3px">'+countText(l)+'</div>':nextCountLabel(sid,tid)}</div></div>`;
    });
    h+=`</div>`;
  });
  if(!any)h+=`<div class="card empty">${ME.tid||ME.admin?'이 날은 수업이 없어요':'이 계정에 연결된 선생님 정보가 없어요'}</div>`;
  m.innerHTML=h;
}
async function bulkOff(tid){
  const d=V.date;const os=occ(d,tid).filter(s=>s.sid&&!lessonOf(s,d));
  if(!os.length)return;
  if(!confirm(`${fmtD(d)} ${tName(tid)}T 수업 ${os.length}개를 모두 '휴강'으로 기록할까요?`))return;
  for(const s of os)await Store.put('lessons',{date:d,time:s.time,tid,sid:s.sid,slotId:s.id,room:s.room||'',kind:s.kind||'',title:'',status:'휴강',memo:''});
  toast('✅ 휴강으로 기록했어요');rerender();
}

let _L=null;
function openLesson(slotId,date){
  const s=S.slots.find(x=>x.id===slotId);if(!s)return;
  const ex=lessonOf(s,date);
  if(ex)return openLessonById(ex.id);
  if(!ME.admin&&s.tid!==myTid()){toast('다른 선생님 수업은 볼 수만 있어요');return;}
  _L={isNew:true,date,time:s.time,tid:s.tid,sid:s.sid,slotId:s.id,room:s.room||'',kind:s.kind||'',title:lastTitle(s.sid,s.tid,date),status:date<=today()?'출석':'',memo:''};
  lessonModal();
}
function openLessonById(id){
  const l=S.lessons.find(x=>x.id===id);if(!l)return;
  _L={...l,isNew:false};lessonModal();
}
function myStudentsFor(tid){
  const ids=new Set(S.slots.filter(s=>s.tid===tid&&s.sid).map(s=>s.sid));
  S.lessons.forEach(l=>{if(l.tid===tid&&l.sid)ids.add(l.sid);});
  return S.students.filter(s=>ids.has(s.id)&&!s.off).sort((a,b)=>a.name.localeCompare(b.name));
}
function openExtra(){
  const tid=ME.admin?(V.stuTid||(activeTeachers()[0]||{}).id):myTid();
  if(!tid){toast('먼저 설정에서 선생님을 등록해주세요');return;}
  _L={isNew:true,extra:true,date:V.date,time:'',tid,sid:'',slotId:null,room:(T(tid)||{}).room||'',kind:'',title:'',status:'보강',memo:''};
  lessonModal();
}

  <label class="l">메모·피드백 <span class="muted small">(선생님·원장님만 봐요)</span></label><textarea class="f" id="lm-memo" ${ro?'disabled':''}>${esc(L.memo||'')}</textarea>`;
  if(!L.isNew&&L.sid&&L.tid){const c=CALC.n[L.id];h+=`<div class="muted small" style="margin-top:8px">${c&&c.n?`이 수업은 <b>${c.n}/${c.total}회차</b>예요`:L.n0?`노션 회차: ${esc(L.n0)}`:''}${L.f?` · 분야: ${esc(L.f)}`:''}${L.c?` · 완성도: ${esc(L.c)}`:''}${L.src==='notion'?' · 노션에서 옮김':L.by?` · 기록: ${esc(L.by)}`:''}</div>`;}

  openM(h);

function lmKeep(){const g=id=>{const e=$('#'+id);return e?e.value:undefined;};const L=_L;['date','time','title','memo','sid','room'].forEach(k=>{const v=g('lm-'+k);if(v!==undefined)L[k]=v;});}
async function saveLesson(){
  const L=_L;
  const g=id=>{const e=$('#'+id);return e?e.value:undefined;};
  if(L.extra){L.sid=g('lm-sid');L.room=g('lm-room');}
  if(g('lm-date')!==undefined)L.date=g('lm-date');
  if(g('lm-time')!==undefined)L.time=g('lm-time');
  L.title=(g('lm-title')||'').trim();L.memo=(g('lm-memo')||'').trim();
  if(!L.sid){toast('학생을 골라주세요');return;}
  if(!L.date){toast('날짜를 넣어주세요');return;}
  if(!L.status){toast('출결을 골라주세요');return;}
  if(L.extra&&!L.kind){const sl=S.slots.find(s=>s.sid===L.sid&&s.tid===L.tid&&s.kind);L.kind=sl?sl.kind:'';}
  if(L.extra&&!L.slotId){const sl=occ(L.date,L.tid).find(x=>x.sid===L.sid&&!lessonOf(x,L.date));if(sl){L.slotId=sl.id;if(!L.time)L.time=sl.time;}}
  const o={...L};delete o.isNew;delete o.extra;
  try{await Store.put('lessons',o);closeM();toast('✅ 저장했어요');rerender();}catch(e){alert('저장 실패: '+e.message);}
}
async function delLesson(){if(!confirm('이 수업 기록을 지울까요?'))return;try{await Store.del('lessons',_L.id);closeM();toast('지웠어요');rerender();}catch(e){alert('실패: '+e.message);}}

  <div class="seg"><button class="${V.ttMode==='teacher'?'on':''}" onclick="V.ttMode='teacher';render()">선생님별</button><button class="${V.ttMode==='room'?'on':''}" onclick="V.ttMode='room';render()">레슨룸별</button></div></div>`;

    if(ME.admin)h+=`<div class="muted small" style="margin-bottom:8px">빈칸을 누르면 수업을 추가하고, 수업을 누르면 기록하거나 시간을 바꿀 수 있어요</div>`;
    if(!ts.length)h+=`<div class="card empty">등록된 선생님이 없어요${ME.admin?' — 설정에서 추가해주세요':''}</div>`;
    ts.forEach(t=>h+=teacherGrid(t,wd));
  }else{
    h+=roomView(wd);
  }
  m.innerHTML=h;
}
function teacherGrid(t,wd){
  const days=wd.slice(0,6);const sun=wd[6];
  const hasSun=occ(sun,t.id).length||extras(sun,t.id).length;if(hasSun)days.push(sun);
  const cellItems={};let minH=13,maxH=21;
  days.forEach(d=>{
    occ(d,t.id).forEach(s=>{const H=hr(s.time);minH=Math.min(minH,H);const dur=+s.dur||60;const span=Math.max(1,Math.ceil(((+s.time.split(':')[1]||0)+dur)/60));maxH=Math.max(maxH,H+span-1);
      (cellItems[d+'|'+H]=cellItems[d+'|'+H]||[]).push({s,l:lessonOf(s,d)});
      for(let k=1;k<span;k++)(cellItems[d+'|'+(H+k)]=cellItems[d+'|'+(H+k)]||[]).push({s,cont:true});});
    extras(d,t.id).forEach(l=>{if(!l.time)return;const H=hr(l.time);minH=Math.min(minH,H);maxH=Math.max(maxH,H);(cellItems[d+'|'+H]=cellItems[d+'|'+H]||[]).push({l,x:true});});
  });
  const workDays=String(t.days||'');
  let h=`<div class="card"><div class="tch-h"><span class="dot" style="background:${tColor(t.id)}"></span><h3 style="margin:0">${esc(SUBJ[t.subj]||'')} · ${esc(t.name)}T</h3><span class="muted">${esc(t.days||'')} ${t.room?'('+esc(t.room)+')':''}</span></div>
  <div class="tt-wrap"><table class="tt"><thead><tr><th style="width:52px">시간</th>${days.map(d=>`<th class="${d===today()?'today':''}">${DOW[dow(d)]}<br><span style="font-weight:500">${pd(d).getMonth()+1}/${pd(d).getDate()}</span></th>`).join('')}</tr></thead><tbody>`;
  for(let H=minH;H<=maxH;H++){
    h+=`<tr><td class="h">${pad(H)}:00</td>`;
    days.forEach(d=>{
      const its=cellItems[d+'|'+H]||[];const off=workDays&&!workDays.includes(DOW[dow(d)])&&!its.length;
      h+=`<td class="cell ${off?'off':''}" onclick="ttCell(event,'${t.id}','${d}',${H})">${its.map(it=>ttItem(it,d)).join('')}</td>`;
    });
    h+=`</tr>`;
  }
  h+=`</tbody></table></div></div>`;
  return h;
}
function ttItem(it,d){
  if(it.x){const l=it.l;return `<span class="it x" onclick="event.stopPropagation();openLessonById('${l.id}')"><span class="tm">${esc(l.time)} 추가</span>${esc(sName(l.sid))}<span class="s st-${l.status}">${l.status}</span></span>`;}

  if(it.cont)return `<span class="it cont ${s.sid?'':'grp'}">↑ ${esc(s.sid?sName(s.sid):s.label||'단체')}</span>`;
  const nm=s.sid?esc(sName(s.sid)):esc(s.label||'단체수업');
  const tm=(s.time.endsWith(':00')?'':s.time)+(s.dur&&+s.dur!==60?(s.time.endsWith(':00')?s.time:'')+'~'+endTime(s.time,s.dur):'');

}
function ttCell(e,tid,d,H){

  slotModal({tid,day:dow(d),time:pad(H)+':00',dur:60,room:(T(tid)||{}).room||'',kind:'',from:monday(d)});

function ttSlot(id,d){

  <button class="btn gray" onclick="closeM();openLog('${s.sid}','${s.tid}')">${esc(sName(s.sid))} 수업일지 보기</button></div>`);

function roomView(wd){
  if(!V.ttDay||!wd.includes(V.ttDay))V.ttDay=wd.includes(today())?today():wd[0];
  const d=V.ttDay;
  let h=`<div class="row" style="margin-bottom:10px">${wd.map(x=>`<button class="chip ${x===d?'on':''}" onclick="V.ttDay='${x}';render()">${DOW[dow(x)]} ${pd(x).getDate()}</button>`).join('')}</div>`;
  const os=occ(d);const ex=extras(d).filter(l=>l.time);
  const rooms=[...S.cfg.rooms];[...os.map(s=>s.room),...ex.map(l=>l.room)].forEach(r=>{if(r&&!rooms.includes(r))rooms.push(r);});
  const cell={};let minH=13,maxH=21;
  os.forEach(s=>{const H=hr(s.time);const span=Math.max(1,Math.ceil(((+s.time.split(':')[1]||0)+(+s.dur||60))/60));minH=Math.min(minH,H);maxH=Math.max(maxH,H+span-1);
    for(let k=0;k<span;k++)(cell[(s.room||'?')+'|'+(H+k)]=cell[(s.room||'?')+'|'+(H+k)]||[]).push({s,cont:k>0});});
  ex.forEach(l=>{const H=hr(l.time);minH=Math.min(minH,H);maxH=Math.max(maxH,H);(cell[(l.room||'?')+'|'+H]=cell[(l.room||'?')+'|'+H]||[]).push({l});});
  h+=`<div class="card"><div class="muted small" style="margin-bottom:8px">${fmtDY(d)} 레슨룸 사용 현황 · 빨간 테두리는 같은 방·같은 시간에 겹친 수업</div><div class="tt-wrap"><table class="tt" style="min-width:${80+rooms.length*86}px"><thead><tr><th style="width:52px">시간</th>${rooms.map(r=>`<th>${esc(r)}</th>`).join('')}</tr></thead><tbody>`;
  for(let H=minH;H<=maxH;H++){
    h+=`<tr><td class="h">${pad(H)}:00</td>`;
    rooms.forEach(r=>{const its=cell[r+'|'+H]||[];const cf=its.length>1;
      h+=`<td class="cell" style="cursor:default">${its.map(it=>{
        if(it.l)return `<span class="it x ${cf?'conflict':''}" style="border-left-color:${tColor(it.l.tid)}" onclick="openLessonById('${it.l.id}')"><span class="tm">${esc(tName(it.l.tid))}T · ${esc(it.l.time)}</span>${esc(sName(it.l.sid))}</span>`;
        const s=it.s;return `<span class="it ${s.sid?'':'grp'} ${it.cont?'cont':''} ${cf?'conflict':''}" style="border-left-color:${tColor(s.tid)}" onclick="ttSlot('${s.id}','${d}')"><span class="tm">${esc(tName(s.tid))}T${s.time.endsWith(':00')?'':' · '+esc(s.time)}</span>${esc(s.sid?sName(s.sid):s.label||'단체')}</span>`;}).join('')}</td>`;});
    h+=`</tr>`;
  }
  h+=`</tbody></table></div></div>`;
  return h;
}

async function saveSlot(isNew){

  o.tid=g('sm-tid');o.day=+g('sm-day');o.time=g('sm-time');o.dur=+g('sm-dur');o.room=g('sm-room')||'';const from=g('sm-from');

  else{
    let sid=g('sm-sid');
    if(sid==='__new'){const nm=(g('sm-new')||'').trim();if(!nm){toast('새 학생 이름을 넣어주세요');return;}
      const dup=S.students.find(x=>x.name===nm&&!x.off);if(dup&&!confirm(`'${nm}' 학생이 이미 있어요. 같은 학생이면 [취소] 후 목록에서 골라주세요.\n동명이인이라 새로 만들까요?`))return;
      const st=await Store.put('students',{name:nm,created:today()});sid=st.id;}
    if(!sid){toast('학생을 골라주세요');return;}
    o.sid=sid;delete o.label;
  }
  try{
    if(isNew){o.from=from||monday(today());o.to='';delete o.id;await Store.put('slots',o);}
    else{
      const old=S.slots.find(x=>x.id===o.id);
      const core=['tid','day','time','dur','room','sid'].some(k=>String(old[k]??'')!==String(o[k]??''));
      const hasLessons=S.lessons.some(l=>l.slotId===old.id);
      if(core&&hasLessons&&from&&from>(old.from||'')){
        await Store.put('slots',{...old,to:addD(from,-1)});
        const n={...o};delete n.id;n.from=from;n.to=old.to&&old.to>=from?old.to:'';await Store.put('slots',n);
      }else{await Store.put('slots',o);}
    }
    closeM();toast('✅ 시간표를 저장했어요');rerender();
  }catch(e){alert('저장 실패: '+e.message);}
}
async function endSlot(){
  const o=_SL;const d=$('#sm-from').value||today();

}

/* ============ 수업일지 (과목 → 선생님 → 학생 → 기록) ============ */
function groupOf(subj){const g=SGROUP.find(x=>x.codes.includes(subj));return g?g.k:'ETC';}
function openLog(sid,tid){const t=T(tid);V.tab='log';V.lgTid=tid;V.lgSubj=t?groupOf(t.subj):V.lgSubj;V.lgSid=sid;V.lgQ='';render();window.scrollTo(0,0);}
function logTeachers(){let ts=S.teachers.slice().sort((a,b)=>(a.off?1:0)-(b.off?1:0)||(a.order??99)-(b.order??99)||a.name.localeCompare(b.name));
  if(!ME.admin)ts=ts.filter(t=>t.id===myTid());else if(!V.lgOffT)ts=ts.filter(t=>!t.off);return ts;}
// 선생님의 학생: 지금 수업 중(시간표 있음) + 지난 학생(기록만 있음)
function studentsOfTeacher(tid){
  const t0=today();const cur=new Map(),past=new Map();
  S.slots.forEach(s=>{if(s.tid!==tid||!s.sid)return;if(!s.to||s.to>=t0){if(!cur.has(s.sid))cur.set(s.sid,s);}});
  S.lessons.forEach(l=>{if(l.tid===tid&&l.sid&&!cur.has(l.sid))past.set(l.sid,true);});
  S.regs.forEach(r=>{if(r.tid===tid&&!cur.has(r.sid))past.set(r.sid,true);});
  const sortCur=[...cur.entries()].map(([sid,sl])=>({sid,sl})).filter(x=>ST(x.sid)).sort((a,b)=>(a.sl.day===0?7:a.sl.day)-(b.sl.day===0?7:b.sl.day)||a.sl.time.localeCompare(b.sl.time));
  const sortPast=[...past.keys()].filter(sid=>ST(sid)).sort((a,b)=>sName(a).localeCompare(sName(b)));
  return {cur:sortCur,past:sortPast};
}
function lastLessonOf(sid,tid){return S.lessons.filter(l=>l.sid===sid&&l.tid===tid).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')))[0];}
function pairPill(sid,tid){const p=pairOf(sid,tid);if(p.noReg)return '';if(p.left<=0)return `<span class="pill" style="background:var(--nob);color:var(--no)">재등록</span>`;return `<span class="pill" style="background:var(--acb);color:var(--ac)">${p.used}/${p.total}</span>`;}

  const {cur,past}=studentsOfTeacher(tid);
  if(!V.lgSid||(!cur.some(x=>x.sid===V.lgSid)&&!past.includes(V.lgSid)))V.lgSid=cur.length?cur[0].sid:(past[0]||null);

  const row=(sid,sl)=>{const st=ST(sid);const ll=lastLessonOf(sid,tid);const on=sid===V.lgSid;
    return `<div class="sr ${on?'on':''}" onclick="V.lgSid='${sid}';${wide?'render()':'rerender()'}"><div style="flex:1;min-width:0"><div><span class="nm">${esc(st.name)}</span> ${kindBadge(sl?sl.kind:'')}</div>
    <div class="sub">${sl?DOW[sl.day]+' '+esc(sl.time):'지난 학생'}${ll?' · '+fmtD(ll.date)+' '+esc(ll.title||ll.status||''):''}</div></div>${pairPill(sid,tid)}</div>`;};
  let list='';
  if(!cur.length&&!past.length)list='<div class="empty">학생이 없어요</div>';
  cur.forEach(x=>{list+=row(x.sid,x.sl);if(!wide&&x.sid===V.lgSid)list+=`<div class="mobile-panel">${logPanel(x.sid,tid)}</div>`;});
  if(past.length){list+=`<div class="sec-h" style="cursor:pointer" onclick="V.lgPast=!V.lgPast;rerender()">지난 학생 ${past.length}명 ${V.lgPast||past.includes(V.lgSid)&&!cur.length?'▲':'▼'}</div>`;
    if(V.lgPast||!cur.length)past.forEach(sid=>{list+=row(sid,null);if(!wide&&sid===V.lgSid)list+=`<div class="mobile-panel">${logPanel(sid,tid)}</div>`;});}
  h+=`<div class="lg"><div class="list">${list}</div>${wide?`<div class="panel">${V.lgSid?`<div class="card">${logPanel(V.lgSid,tid)}</div>`:''}</div>`:''}</div>`;
  m.innerHTML=h;

// 노션 탭에서 postMessage 로 {type:'jb-notion-import', payload:[{subj,name,students:[{name,kind,day,time,birth,info,lessons:[{d,t,n,s,f,c,m}]}]}]} 를 보내면 받음
const NOTION_ORIGIN='https://app.notion.com';
let _NIMP=null;
window.addEventListener('message',e=>{
  if(e.origin!==NOTION_ORIGIN||!e.data||e.data.type!=='jb-notion-import')return;
  try{e.source&&e.source.postMessage({type:'jb-notion-ack'},e.origin);}catch(x){}
  if(_NIMP)return;_NIMP=e.data.payload;
  const tryOpen=()=>{if(ME&&ME.admin&&!DEMO)notionImportModal();else setTimeout(tryOpen,700);};tryOpen();
});
const N_SUBJ={'VOCAL':'V','PIANO / COMPOSE':'CP','GUITAR':'G','MIDI':'M'};
const N_KIND={'오디션':'A','키즈오디션':'KA','취미':'H','입시':'E','전문':'P'};
const N_DAY={'일요일':0,'월요일':1,'화요일':2,'수요일':3,'목요일':4,'금요일':5,'토요일':6};
const nTName=n=>{n=String(n||'').replace(/\(.*?\)/g,'').trim();if(n==='이전 자료')return '이전 선생님';return n.replace(/(T|쌤|선생님)$/,'').trim();};
const nSKey=n=>String(n||'').replace(/\s/g,'').replace(/님$/,'');
function notionPlan(raw){
  const teachers={};
  raw.forEach(t=>{const nm=nTName(t.name);const subj=N_SUBJ[t.subj]||'ETC';const k=nm+'|'+subj;
    if(!teachers[k])teachers[k]={name:nm,subj,students:[]};const arch=/삭제/.test(t.name);teachers[k].students.push(...t.students.map(x=>({...x,arch})));});
  let nL=0,nS=new Set();Object.values(teachers).forEach(t=>t.students.forEach(st=>{nS.add(nSKey(st.name));nL+=st.lessons.filter(l=>/^\d{4}-\d{2}-\d{2}$/.test(l.d)).length;}));
  return {teachers:Object.values(teachers),nStudents:nS.size,nLessons:nL};
}

  const pl=notionPlan(_NIMP);
  openM(`<div class="mh"><h3>노션 자료 가져오기</h3><button class="x" onclick="closeM()">×</button></div>
  <div class="banner info">노션에서 자료를 받았어요<br><b>선생님 ${pl.teachers.length}명 · 학생 ${pl.nStudents}명 · 수업기록 ${pl.nLessons}건</b></div>
  <div class="muted small" style="line-height:1.7">· 노션의 선생님·학생·구분·요일·시간으로 시간표를 만들어요<br>· 수업기록(날짜·진도·회차·출결·내용)을 그대로 옮겨요<br>· 마지막 '1회차'부터 회차가 이어지게 등록 정보를 만들어요<br>· 이미 있는 자료와 겹치는 건 건너뛰어서, 다시 가져와도 두 번 들어가지 않아요</div>
  <div id="ni-prog" class="muted" style="margin-top:10px"></div>
  <div class="mfoot"><button class="btn gray" onclick="closeM()">취소</button><button class="btn" id="ni-go" onclick="runNotionImport()">가져오기</button></div>`);
}
async function runNotionImport(){
  const btn=$('#ni-go');if(btn)btn.disabled=true;const prog=m=>{const e=$('#ni-prog');if(e)e.textContent=m;};
  try{const r=await notionImport(_NIMP,prog);closeM();
    alert(`✅ 노션 자료를 옮겼어요\n\n선생님 ${r.t}명 · 학생 ${r.s}명 · 시간표 ${r.sl}개\n수업기록 ${r.l}건 · 회차 등록 ${r.r}건${r.skip?`\n(이미 있던 기록 ${r.skip}건은 건너뜀)`:''}`);
    _NIMP=null;V.tab='log';render();
  }catch(e){prog('실패: '+e.message);if(btn)btn.disabled=false;}
}
async function bulkWrite(items,prog,label){ // items: [key,obj]
  const now=Date.now();
  items.forEach(([k,o])=>{if(!o.id)o.id=DEMO?rid():db.collection(COL[k]).doc().id;o.at=now;o.by=ME.name;S[k].push(o);});
  if(DEMO){demoSave();return;}
  for(let i=0;i<items.length;i+=400){const b=db.batch();items.slice(i,i+400).forEach(([k,o])=>{const {id,...rest}=o;b.set(db.collection(COL[k]).doc(id),clean(rest));});await b.commit();prog&&prog(`${label} ${Math.min(i+400,items.length)}/${items.length}`);}
}
async function notionImport(raw,prog){
  const pl=notionPlan(raw);const t0=today();const res={t:0,s:0,sl:0,l:0,r:0,skip:0};
  const seedT=Object.fromEntries(SEED_T.map(x=>[x[0],x]));
  // 1) 선생님
  const tIds={};const newT=[];
  pl.teachers.forEach((nt,i)=>{
    let t=S.teachers.find(x=>x.name===nt.name&&groupOf(x.subj)===groupOf(nt.subj));
    if(!t){const sd=seedT[nt.name];t={name:nt.name,subj:nt.subj,days:sd?sd[2]:'',room:sd?sd[3]:'',color:TCOLORS[(S.teachers.length+newT.length)%TCOLORS.length],order:sd?SEED_T.indexOf(sd):20+i,off:!sd};newT.push(['teachers',t]);}
    tIds[nt.name+'|'+nt.subj]=t;});
  await bulkWrite(newT,prog,'선생님');res.t=newT.length;
  // 2) 학생
  const sByKey={};S.students.forEach(x=>{sByKey[nSKey(x.name)]=x;});
  const newS=[];
  pl.teachers.forEach(nt=>nt.students.forEach(ns=>{const k=nSKey(ns.name);if(!k)return;
    if(!sByKey[k]){const o={name:ns.name.replace(/\s/g,''),birth:ns.birth||'',memo:ns.info||'',created:t0,src:'notion'};sByKey[k]=o;newS.push(['students',o]);}
    else if(!sByKey[k].birth&&ns.birth&&newS.some(x=>x[1]===sByKey[k]))sByKey[k].birth=ns.birth;}));
  await bulkWrite(newS,prog,'학생');res.s=newS.length;
  // 3) 시간표 (지금 다니는 선생님 + 요일이 있는 학생만)
  const newSl=[];const slotOf={};
  pl.teachers.forEach(nt=>{const t=tIds[nt.name+'|'+nt.subj];nt.students.forEach(ns=>{
    const st=sByKey[nSKey(ns.name)];if(!st)return;const day=N_DAY[ns.day];
    const dated=ns.lessons.filter(l=>/^\d{4}-\d{2}-\d{2}$/.test(l.d)).map(l=>l.d).sort();
    if(t.off||ns.arch||day===undefined||!/^\d{1,2}:\d{2}$/.test(ns.time||'')||N_KIND[ns.kind]===undefined&&ns.kind==='종료')return;
    const time=ns.time.length===4?'0'+ns.time:ns.time;
    let sl=S.slots.find(x=>x.sid===st.id&&x.tid===t.id&&x.day===day&&x.time===time&&(!x.to||x.to>=t0));
    if(!sl){sl={tid:t.id,sid:st.id,day,time,dur:60,room:t.room||'',kind:N_KIND[ns.kind]||'',from:dated[0]||'2026-01-01',to:''};newSl.push(['slots',sl]);}
    slotOf[st.id+'|'+t.id]=sl;});});
  await bulkWrite(newSl,prog,'시간표');res.sl=newSl.length;
  // 퇴원: 지금 시간표가 하나도 없는 새 학생
  for(const [,o] of newS){if(!S.slots.some(x=>x.sid===o.id&&(!x.to||x.to>=t0))){o.off=true;if(!DEMO)await db.collection(COL.students).doc(o.id).update({off:true});}}
  // 4) 수업기록
  const seen=new Set(S.lessons.map(l=>[l.sid,l.tid,l.date,(l.title||'').trim(),l.status||''].join('|')));
  const newL=[];
  pl.teachers.forEach(nt=>{const t=tIds[nt.name+'|'+nt.subj];nt.students.forEach(ns=>{
    const st=sByKey[nSKey(ns.name)];if(!st)return;const sl=slotOf[st.id+'|'+t.id];
    ns.lessons.forEach(l=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(l.d))return;
      const status=STATUS.includes(l.s)?l.s:'';const title=(l.t||'').trim();
      if(!status&&!title&&!l.m)return;
      const key=[st.id,t.id,l.d,title,status].join('|');if(seen.has(key)){res.skip++;return;}seen.add(key);
      const o={date:l.d,time:sl?sl.time:(ns.time||''),tid:t.id,sid:st.id,slotId:sl&&sl.day===dow(l.d)&&l.d>=sl.from?sl.id:null,room:sl?sl.room:'',kind:sl?sl.kind:(N_KIND[ns.kind]||''),title,status,memo:l.m||'',src:'notion'};
      if(l.n)o.n0=l.n;if(l.f)o.f=l.f;if(l.c)o.c=l.c;
      // 같은 날 같은 시간표에 두 번 기록된 건 두 번째부터 '추가'로
      if(o.slotId&&newL.some(([,x])=>x.slotId===o.slotId&&x.date===o.date))o.slotId=null;
      newL.push(['lessons',o]);});});});
  await bulkWrite(newL,prog,'수업기록');res.l=newL.length;
  // 5) 회차 등록: 지금 다니는 수강은 마지막 '1회차'(출석·결석·보강)부터 4회로
  const newR=[];
  Object.entries(slotOf).forEach(([k,sl])=>{const [sid,tid]=k.split('|');
    if(S.regs.some(r=>r.sid===sid&&r.tid===tid))return;
    const ones=S.lessons.filter(l=>l.sid===sid&&l.tid===tid&&COUNTED.has(l.status)&&/^1\s*회차$/.test(l.n0||'')).sort((a,b)=>b.date.localeCompare(a.date));
    if(ones[0])newR.push(['regs',{sid,tid,start:ones[0].date,total:4,done0:0,memo:'노션에서 이어서'}]);});
  await bulkWrite(newR,prog,'회차');res.r=newR.length;
  if(!S.cfg.startDate){S.cfg.startDate=t0;await Store.saveCfg();}
  return res;
}

 ['한지예',6,'12:00','최평솔'],['한지예',6,'13:00','조한',60,'','E'],['한지예',4,'21:00','이다은',60,'','KA'],
 ['김선령',2,'17:00','최서우'],['김선령',3,'17:00','김하율',120,'','KA'],['김선령',2,'18:00','민윤지'],['김선령',2,'20:00','#보컬디자인',120,'JB홀'],['김선령',3,'20:00','김의진'],

async function seedData(silent){
  if(S.teachers.length&&!silent)return;
  if(!silent&&!confirm('구글 일정표 11월(9~14일) 시간표로 시작할까요?'))return;
  const FROM=DEMO?'2026-10-26':'2026-11-09';
  const tid={};
  for(let i=0;i<SEED_T.length;i++){const[n,subj,days,room]=SEED_T[i];const t=await Store.put('teachers',{name:n,subj,days,room,color:TCOLORS[i%TCOLORS.length],order:i});tid[n]=t.id;}
  const sid={};
  for(const row of SEED_S){const nm=row[3];if(nm.startsWith('#')||sid[nm])continue;const st=await Store.put('students',{name:nm,created:FROM});sid[nm]=st.id;}
  for(const[tn,day,time,who,dur,room,kind]of SEED_S){
    const t=SEED_T.find(x=>x[0]===tn);
    const o={tid:tid[tn],day,time,dur:dur||60,room:room||t[3],kind:kind||'',from:FROM,to:''};
    if(who.startsWith('#')){o.sid=null;o.label=who.slice(1);}else o.sid=sid[who];
    await Store.put('slots',o);
  }
  if(DEMO){ // 체험용 수업 기록 몇 개

    const sl=n=>S.slots.find(s=>s.sid===sid[n]);
    for(const[n,title]of lt){const s=sl(n);await Store.put('regs',{sid:s.sid,tid:s.tid,start:'2026-10-30',total:4,done0:0});
      for(const d of ['2026-10-30','2026-11-06']){await Store.put('lessons',{date:d,time:s.time,tid:s.tid,sid:s.sid,slotId:s.id,room:s.room,kind:s.kind,title,status:d==='2026-11-06'&&n==='김민나'?'결석':'출석',memo:''});}

}
